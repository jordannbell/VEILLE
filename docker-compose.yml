services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: veille
      POSTGRES_PASSWORD: ${VEILLE_DB_PASSWORD}
      POSTGRES_DB: veille
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veille -d veille"]
      interval: 5s
      timeout: 3s
      retries: 10

  rundeck:
    build:
      context: ./rundeck
      args:
        RUNDECK_VERSION: ${RUNDECK_VERSION}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4440:4440"
    mem_limit: 1536m
    environment:
      RUNDECK_GRAILS_URL: http://localhost:4440
      RUNDECK_SERVER_ADDRESS: 0.0.0.0
      RUNDECK_DATABASE_DRIVER: org.postgresql.Driver
      RUNDECK_DATABASE_URL: jdbc:postgresql://postgres:5432/rundeck
      RUNDECK_DATABASE_USERNAME: rundeck
      RUNDECK_DATABASE_PASSWORD: ${RUNDECK_DB_PASSWORD}
      VEILLE_DB_DSN: postgresql://veille:${VEILLE_DB_PASSWORD}@postgres:5432/veille
      TZ: Europe/Paris
    volumes:
      - rundeck_data:/home/rundeck/server/data
      - ./collectors:/opt/veille/collectors:ro
      - ./sql:/opt/veille/sql:ro
      - ./scripts:/opt/veille/scripts:ro

  nagios:
    build: ./nagios
    profiles: ["supervision"]
    ports:
      - "8081:80"
    mem_limit: 512m
    environment:
      NAGIOS_TIMEZONE: Europe/Paris
      VEILLE_DB_DSN: postgresql://nagios_ro:${NAGIOS_DB_PASSWORD}@postgres:5432/veille
    volumes:
      - nagios_etc:/opt/nagios/etc
      - nagios_var:/opt/nagios/var
      - ./nagios/veille.cfg:/opt/nagios/etc/conf.d/veille.cfg:ro
      - ./nagios/plugins/check_veille_freshness:/opt/nagios/libexec/check_veille_freshness:ro

volumes:
  pgdata:
  rundeck_data:
  nagios_etc:
  nagios_var:
