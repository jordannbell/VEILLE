# --- Hotes : les composants de la stack Veille ---
define host {
    use             linux-server
    host_name       postgres
    alias           PostgreSQL (base veille)
    address         postgres
    check_command   check_tcp!5432
}

define host {
    use             linux-server
    host_name       rundeck
    alias           Rundeck (ordonnanceur)
    address         rundeck
    check_command   check_tcp!4440
}

# --- Services : ce qu'on controle sur chaque hote ---
define service {
    use                  local-service
    host_name            postgres
    service_description  PostgreSQL port 5432
    check_command        check_tcp!5432
    check_interval       1
    retry_interval       1
}

define service {
    use                  local-service
    host_name            rundeck
    service_description  Rundeck interface web
    check_command        check_http!-p 4440 -u /user/login
    check_interval       1
    retry_interval       1
}
